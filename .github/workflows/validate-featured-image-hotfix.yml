name: Validate featured image hotfix

on:
  push:
    branches: [hotfix/persist-featured-images]
    paths:
      - '.github/workflows/validate-featured-image-hotfix.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_BASE_PATH: /
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run test:legacy
      - name: Verify homepage featured images
        shell: python
        run: |
          from pathlib import Path
          from html.parser import HTMLParser

          class ImgCounter(HTMLParser):
              def __init__(self):
                  super().__init__(); self.count = 0
              def handle_starttag(self, tag, attrs):
                  if tag == 'img': self.count += 1

          parser = ImgCounter()
          parser.feed(Path('dist/index.html').read_text(encoding='utf-8'))
          print(f'Homepage images: {parser.count}')
          if parser.count < 7:
              raise SystemExit(f'Expected at least 7 homepage images, found {parser.count}')
