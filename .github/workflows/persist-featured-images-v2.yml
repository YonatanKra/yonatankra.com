name: Persist recovered featured images v2

on:
  push:
    branches: [hotfix/persist-featured-images]
    paths:
      - '.github/workflows/persist-featured-images-v2.yml'

permissions:
  actions: read
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download last good preview artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9839845504/zip" \
            -o /tmp/preview.zip
          mkdir -p /tmp/preview-zip /tmp/preview-site
          unzip -q /tmp/preview.zip -d /tmp/preview-zip
          tar -xf /tmp/preview-zip/artifact.tar -C /tmp/preview-site

      - name: Restore featuredImage frontmatter and media
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          import shutil

          SITE = Path('/tmp/preview-site')
          POSTS = Path('src/content/posts')
          PUBLIC = Path('public')

          class FeaturedParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.src = None
              def handle_starttag(self, tag, attrs):
                  if tag != 'img' or self.src:
                      return
                  data = dict(attrs)
                  classes = set((data.get('class') or '').split())
                  if 'featured-image' in classes and data.get('src'):
                      self.src = data['src']

          recovered = {}
          for html in SITE.glob('*/index.html'):
              parser = FeaturedParser()
              parser.feed(html.read_text(encoding='utf-8', errors='ignore'))
              if parser.src:
                  recovered[html.parent.name] = re.sub(r'^/yonatankra\.com', '', parser.src)

          if len(recovered) != 57:
              raise SystemExit(f'Expected 57 recovered featured images, found {len(recovered)}')

          changed = matched = copied = 0
          for file in POSTS.glob('*.md'):
              src = recovered.get(file.stem)
              if not src:
                  continue
              matched += 1
              text = file.read_text(encoding='utf-8')
              fm = re.match(r'^---\n([\s\S]*?)\n---\n', text)
              if not fm:
                  raise SystemExit(f'Missing frontmatter: {file}')
              if not re.search(r'^featuredImage\s*:', fm.group(1), re.M):
                  new_frontmatter = fm.group(1).rstrip() + f'\nfeaturedImage: {src}'
                  file.write_text('---\n' + new_frontmatter + '\n---\n' + text[fm.end():], encoding='utf-8')
                  changed += 1

              source = SITE / src.lstrip('/')
              target = PUBLIC / src.lstrip('/')
              if not source.exists():
                  raise SystemExit(f'Featured image missing from preserved preview artifact: {src}')
              if not target.exists():
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
                  copied += 1

          print(f'Recovered mapping: {len(recovered)}; matched posts: {matched}; changed posts: {changed}; copied media: {copied}')
          if matched != 57 or changed != 57:
              raise SystemExit(f'Expected to change all 57 matching posts; matched={matched}, changed={changed}')

      - name: Verify recovery
        shell: python
        run: |
          from pathlib import Path
          import re
          count = 0
          missing = []
          for file in Path('src/content/posts').glob('*.md'):
              text = file.read_text(encoding='utf-8')
              m = re.search(r'^featuredImage:\s*["\']?([^"\'\n]+)', text, re.M)
              if not m:
                  continue
              count += 1
              src = m.group(1).strip()
              if src.startswith('/wp-content/uploads/') and not (Path('public') / src.lstrip('/')).exists():
                  missing.append((file.name, src))
          print(f'Posts with featuredImage: {count}; missing files: {len(missing)}')
          if count != 57:
              raise SystemExit(f'Expected 57 posts with featuredImage, found {count}')
          if missing:
              raise SystemExit('Missing featured media:\n' + '\n'.join(f'{f}: {s}' for f, s in missing))

      - name: Commit recovered content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/posts public/wp-content/uploads
          git commit -m 'content: persist featured images and metadata'
          git push origin HEAD:hotfix/persist-featured-images
