name: Preview two migrated posts

on:
  push:
    branches: [preview-two-posts-fix]
    paths:
      - 'src/**'
      - 'scripts/import-preview-posts.mjs'
      - 'scripts/download-live-media.mjs'
      - '.github/workflows/preview-two-posts.yml'
      - 'astro.config.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-two-posts-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Import two live posts
        run: node scripts/import-preview-posts.mjs
      - name: Download referenced media
        run: node scripts/download-live-media.mjs migration/media-urls.json
      - name: Build Astro
        run: npm run build
      - name: Validate preview legacy URLs
        run: npm run test:legacy
      - name: Upload preview site
        uses: actions/upload-artifact@v4
        with:
          name: preview-two-posts-site
          path: dist
          if-no-files-found: error
