name: Preview two migrated posts

on:
  push:
    branches: [preview-two-posts-fix]
    paths:
      - 'src/**'
      - 'scripts/import-preview-posts.mjs'
      - 'scripts/download-live-media.mjs'
      - 'scripts/validate-legacy-urls.mjs'
      - '.github/workflows/preview-two-posts.yml'
      - 'astro.config.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-two-posts-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Import two live posts
        run: node scripts/import-preview-posts.mjs
      - name: Download referenced media
        run: node scripts/download-live-media.mjs migration/media-urls.json
      - name: Build Astro
        run: npm run build
      - name: Validate preview legacy URLs
        run: npm run test:legacy
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
